name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mercadinho_ci
      DATABASE_DIRECT_URL: postgresql://postgres:postgres@localhost:5432/mercadinho_ci
      AUTH_SECRET: ci-secret-com-pelo-menos-32-caracteres-123456
      DATABASE_SSL: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Build Next.js
        run: npm run build

  publish:
    name: Publicar imagens no GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar nome da imagem
        id: image
        shell: bash
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da aplicação
        uses: docker/build-push-action@v6
        with:
          context: .
          target: app
          push: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
          tags: |
            ${{ steps.image.outputs.name }}:app-${{ github.sha }}
            ${{ steps.image.outputs.name }}:app-latest

      - name: Build e push das migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migration
          push: true
          cache-from: type=gha,scope=migration
          cache-to: type=gha,mode=max,scope=migration
          tags: |
            ${{ steps.image.outputs.name }}:migration-${{ github.sha }}
            ${{ steps.image.outputs.name }}:migration-latest

  deploy:
    name: Deploy na VPS
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      DEPLOY_PATH: /opt/mercadinho-sao-francisco
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar SSH
        shell: bash
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Enviar configuração do Compose
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          PORT="${VPS_PORT:-22}"
          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" "mkdir -p '$DEPLOY_PATH'"
          scp -P "$PORT" docker-compose.prod.yml "$VPS_USER@$VPS_HOST:$DEPLOY_PATH/docker-compose.prod.yml"

      - name: Migrar e publicar
        shell: bash
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ needs.publish.outputs.image }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          PORT="${VPS_PORT:-22}"
          APP_IMAGE="$IMAGE:app-$COMMIT_SHA"
          MIGRATION_IMAGE="$IMAGE:migration-$COMMIT_SHA"

          printf '%s' "$GHCR_TOKEN" | ssh -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          ssh -p "$PORT" "$VPS_USER@$VPS_HOST" \
            "cd '$DEPLOY_PATH' && \
             test -f .env.production && \
             APP_IMAGE='$APP_IMAGE' MIGRATION_IMAGE='$MIGRATION_IMAGE' docker compose --env-file .env.production -f docker-compose.prod.yml --profile migration pull && \
             APP_IMAGE='$APP_IMAGE' MIGRATION_IMAGE='$MIGRATION_IMAGE' docker compose --env-file .env.production -f docker-compose.prod.yml --profile migration run --rm migrate && \
             APP_IMAGE='$APP_IMAGE' MIGRATION_IMAGE='$MIGRATION_IMAGE' docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans && \
             docker image prune -f"
